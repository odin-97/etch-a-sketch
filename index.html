<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>

<body>
    <div class="header">
        <div class="title">
            <h1>Etch-A-Sketch</h1>
        </div>
        <div class="settings">
            <div class="buttonContainer">
                <p>Grid-Size</p>
                <button class="button4">4x4</button>
                <button class="button16">16x16</button>
                <button class="button32">32x32</button>
                <button class="button64">64x64</button>
            </div>
            <div class="randomColor">
                <button>Randomize Color!</button>
            </div>
        </div>
    </div>
    <div class="gridContainer"></div>
</body>

</html>
